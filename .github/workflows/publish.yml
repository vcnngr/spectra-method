name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm CLI satisfies Trusted Publishers minimum (>=11.5.1)
        run: |
          npm --version
          node -e "const semver=process.versions; const v=require('child_process').execSync('npm --version').toString().trim(); const [maj,min,pat]=v.split('.').map(Number); if (maj<11 || (maj===11 && min<5) || (maj===11 && min===5 && pat<1)) { console.error('npm '+v+' below required 11.5.1'); process.exit(1); } console.log('npm '+v+' OK');"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Validate package structure
        run: npm test

      - name: Validate install smoke test
        run: npm run test:smoke

      - name: Publish with provenance via Trusted Publisher (OIDC)
        run: npm publish --provenance --access public
