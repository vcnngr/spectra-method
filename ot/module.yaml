code: ot
name: "SPECTRA OT/ICS Security Kit"
description: "OT/ICS Security module generated by spectra-new-module"
module_version: 0.1.0
default_selected: false

header: "OT/ICS Security Configuration"
subheader: "Configure the OT/ICS Security module."

ot_artifacts:
  prompt: "Where should OT/ICS Security engagement artifacts be stored?"
  default: "{output_folder}/engagements/{engagement_id}/ot"
  result: "{project-root}/{value}"

ot_reports:
  prompt: "Where should OT/ICS Security reports be stored?"
  default: "{output_folder}/engagements/{engagement_id}/ot/reports"
  result: "{project-root}/{value}"

directories:
  - "{output_folder}/engagements/{engagement_id}/ot"
  - "{output_folder}/engagements/{engagement_id}/ot/reports"
